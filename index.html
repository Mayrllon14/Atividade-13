<!DOCTYPE html>>
<html>
    <head>
        <title>Atividade 13</title>
    </head>
    <body>
        <h1>Formulário de Cadastro</h1>
        <form action="/enviar_dados" method="get">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">email:</label>
        <input type="email" id="email" required><br><br>

        <label for="país">País:</label>
        <select id="país" name="país">
             <option value="brasil">Brasil</option>
             <option value="eua">Estados unidos</option>
             <option value="Portugal">Portugal</option>
        </select><br><br>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea><br><br>

        <input type="submit" id="send" value="Enviar">
        <input type="reset" id="Clean" value="limpar">
        </form>
           
       
    </body>
</html>
